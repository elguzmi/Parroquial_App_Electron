name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # opcional: lanzar a mano desde Actions

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write # necesario para crear/publicar el Release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - run: npm ci

      - name: Build & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release
